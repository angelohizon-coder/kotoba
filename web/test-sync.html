<!DOCTYPE html>
<html>
<head>
  <title>Firebase Sync Diagnostic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px 0; }
    #log { background: #eee; padding: 10px; white-space: pre-wrap; font-family: monospace; min-height: 200px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Firebase Diagnostic Tool</h1>
  <p>Use this page to verify if your Firebase project is accepting data correctly.</p>
  <button id="btnLogin">1. Log In to Firebase</button>
  <button id="btnTestWrite" disabled>2. Test Write to Firestore</button>
  <button id="btnTestRead" disabled>3. Test Read from Firestore</button>
  
  <h3>Diagnostic Log:</h3>
  <div id="log">Waiting to start...</div>

  <script>
    function logMessage(msg, type = '') {
      const logEl = document.getElementById('log');
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(div);
      console.log(msg);
    }

    window.addEventListener('load', () => {
      logMessage('Page loaded. Initializing Firebase...');
      const firebaseConfig = {
        apiKey: "AIzaSyD0jeZyg4ZNv0OZHaKMrdegHyQ1XuIjrqU",
        authDomain: "kotoba-41ab0.firebaseapp.com",
        projectId: "kotoba-41ab0",
        storageBucket: "kotoba-41ab0.firebasestorage.app",
        messagingSenderId: "792855742091",
        appId: "1:792855742091:web:d19a67284fdc6cf0c0368e",
        measurementId: "G-B9EVNBXG7E"
      };

      try {
        firebase.initializeApp(firebaseConfig);
        logMessage('Firebase initialized.', 'success');
      } catch (e) {
        logMessage('Firebase init failed: ' + e.message, 'error');
      }

      const auth = firebase.auth();
      const db = firebase.firestore();
      let currentUser = null;

      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          logMessage(`Logged in as: ${user.email} (UID: ${user.uid})`, 'success');
          document.getElementById('btnLogin').textContent = 'Logged In';
          document.getElementById('btnLogin').disabled = true;
          document.getElementById('btnTestWrite').disabled = false;
          document.getElementById('btnTestRead').disabled = false;
        } else {
          logMessage('Not logged in.');
        }
      });

      document.getElementById('btnLogin').addEventListener('click', async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } catch (e) {
          logMessage('Login failed: ' + e.message, 'error');
        }
      });

      document.getElementById('btnTestWrite').addEventListener('click', async () => {
        if (!currentUser) return;
        logMessage('Attempting to write test data to Firestore...');
        try {
          await db.collection('users').doc(currentUser.uid).set({
            testData: "Hello from Diagnostic Tool",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          logMessage('Write SUCCESS! Firestore permissions are correct.', 'success');
        } catch (e) {
          logMessage('Write FAILED: ' + e.message, 'error');
          if (e.message.includes('Missing or insufficient permissions')) {
            logMessage('ACTION REQUIRED: Your Firestore Database Rules are blocking access. Go to Firebase Console -> Firestore Database -> Rules, and change them to allow read/write.', 'error');
          }
        }
      });

      document.getElementById('btnTestRead').addEventListener('click', async () => {
        if (!currentUser) return;
        logMessage('Attempting to read data from Firestore...');
        try {
          const doc = await db.collection('users').doc(currentUser.uid).get();
          if (doc.exists) {
            logMessage('Read SUCCESS! Data: \n' + JSON.stringify(doc.data(), null, 2), 'success');
          } else {
            logMessage('Read SUCCESS! But no data document found for this user.', 'success');
          }
        } catch (e) {
          logMessage('Read FAILED: ' + e.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
