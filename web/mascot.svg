<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Momo, Kotoba's tanuki study buddy</title>
  <desc id="desc">A cheerful caramel-colored Japanese raccoon dog waves hello with a broad, rounded mitten paw. Momo has a dark eye mask, rosy cheeks, a fluffy tail, a little green leaf, and a teal school backpack.</desc>
  <style>
    /* The plain asset stays still. Its local #wave fragment is an optional greeting. */
    #wave { transform-box: view-box; transform-origin: 75px 155px; }
    #wave:target { animation: momo-paw-hello 1000ms ease-in-out 1; }
    @keyframes momo-paw-hello {
      0%, 100% { transform: rotate(0deg); }
      18% { transform: rotate(12deg); }
      38% { transform: rotate(-10deg); }
      58% { transform: rotate(10deg); }
      78% { transform: rotate(-6deg); }
    }
    @media (prefers-reduced-motion: reduce) { #wave:target { animation: none; } }
  </style>

  <ellipse cx="121" cy="242" rx="76" ry="9" fill="#556977" fill-opacity=".14"/>

  <!-- A broad, dark-tipped tanuki tail and a little school backpack. -->
  <path d="M161 219C195 232 222 211 222 179C222 159 210 147 196 153C181 160 187 184 169 184L161 219Z" fill="#D99046" stroke="#75472F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M207 151C216 155 222 165 222 179C222 192 218 204 210 212C199 208 193 201 191 192C205 180 197 159 207 151Z" fill="#75472F"/>
  <rect x="155" y="133" width="39" height="71" rx="16" fill="#1D9B96" stroke="#146B70" stroke-width="4"/>
  <path d="M169 144H181M177 159V182" stroke="#5ACBC0" stroke-width="5" stroke-linecap="round"/>

  <!-- Rounded body, feet, and a raised waving paw. -->
  <ellipse cx="89" cy="230" rx="22" ry="13" fill="#75472F"/>
  <ellipse cx="150" cy="230" rx="22" ry="13" fill="#75472F"/>
  <g id="wave">
    <path d="M75 155C54 151 45 132 35 117" stroke="#75472F" stroke-width="28" stroke-linecap="round"/>
    <path d="M75 155C54 151 45 132 35 117" stroke="#D99046" stroke-width="20" stroke-linecap="round"/>
    <path d="M26 124C17 119 13 109 16 100C19 91 28 86 37 89C45 91 47 98 46 105C52 104 55 108 53 113C50 122 38 129 26 124Z" fill="#D99046" stroke="#75472F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="31" cy="108" rx="8" ry="9" transform="rotate(-17 31 108)" fill="#FFE6BD"/>
  </g>
  <ellipse cx="120" cy="178" rx="58" ry="58" fill="#D99046" stroke="#75472F" stroke-width="4"/>
