    <meta name="theme-color" content="#58cc02" />
    <script>
      // Apply the saved palette before styles paint; invalid or blocked storage uses light.
      try {
        const saved = JSON.parse(localStorage.getItem('kotoba-n3-progress') || 'null');
        document.documentElement.dataset.theme = saved?.settings?.theme === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="description" content="Integrated JLPT N3–N1 Japanese learning paths, N5/N4 review, flashcards, listening practice, and full timed mocks. No npm needed. Progress saved on your device." />
